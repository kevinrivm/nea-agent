name: imagen

# La imagen Docker de Nea.
#
# - En cada PR y en cada push a main se CONSTRUYE sin publicar: atrapa un
#   Dockerfile o unas dependencias rotas antes de que lleguen a quien
#   despliega.
# - Al crear un tag `vX.Y.Z` se PUBLICA en GitHub Container Registry:
#   ghcr.io/kevinrivm/nea-agent:X.Y.Z (y X.Y, y `latest` si no es
#   prerelease). Es lo que instala el starter: Coolify descarga la imagen en
#   vez de construirla en el VPS.
#
# La versión (NEA_VERSION, sin la «v»: `1.0.0`, igual que la etiqueta de la
# imagen y que el `version` del CRM) y el commit (SOURCE_COMMIT) se hornean como build
# args: es lo que /health enseña como `version` y `commit`.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Solo se usa al publicar (tags). En un PR desde un fork GitHub lo baja a
  # lectura por su cuenta.
  packages: write

jobs:
  imagen:
    name: docker build${{ startsWith(github.ref, 'refs/tags/v') && ' · publicar' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Entrar a GHCR (solo al publicar)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha

      # Solo amd64 por ahora (los VPS de la guía); arm64 se agrega cuando haya
      # quien lo instale.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEA_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || 'dev' }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
